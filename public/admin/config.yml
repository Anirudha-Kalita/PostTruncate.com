# ──────────────────────────────────────────────────────────────────────────
# Sveltia CMS — PostTruncate blog (English only).
# Served statically at /admin/config.yml and loaded by /admin/.
# ──────────────────────────────────────────────────────────────────────────
backend:
  name: github
  repo: Anirudha-Kalita/PostTruncate.com
  branch: master
  # OAuth is handled by the deployed Sveltia auth Worker. This is the Worker
  # BASE URL only — the "/callback" suffix lives on the GitHub OAuth app side,
  # NOT here. (No PUBLIC_ env var exists in this codebase, and config.yml is a
  # static file that can't read env vars, so the URL is hardcoded.)
  base_url: https://posttruncate-cms-auth.anirudha-kalita44.workers.dev

# Editorial workflow: edits become PRs (draft → in review → ready) instead of
# committing straight to main.
publish_mode: editorial_workflow

# Image uploads commit to public/og and are referenced as /og/<file>, matching
# the ogImage convention documented in src/content.config.ts.
media_folder: public/og
public_folder: /og

collections:
  - name: blog
    label: Blog
    label_singular: Post
    description: English blog posts (src/content/blog/en).
    folder: src/content/blog/en
    create: true
    # Filename = the slug field → files are written as <slug>.md, exactly like
    # the hand-authored posts.
    slug: '{{fields.slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, widget: string, pattern: ['^.{1,70}$', 'Keep the title to 70 characters or fewer.'] }
      # Optional deck shown under the title in the article (above author + date).
      # Visual only — separate from the SEO meta description below.
      - { name: subtitle, label: Subtitle, widget: string, required: false, hint: 'Optional. Shown under the title, above the author and date.', pattern: ['^.{0,200}$', 'Keep the subtitle to 200 characters or fewer.'] }
      - { name: description, label: Meta description, widget: string, pattern: ['^.{1,180}$', 'Keep the description to 180 characters or fewer.'] }
      - { name: publishDate, label: Publish date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', picker_utc: true }
      - { name: updatedDate, label: Updated date, widget: datetime, required: false, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', picker_utc: true }
      # Hidden: English-only for now. Matches the locale folder (build guard).
      - { name: locale, label: Locale, widget: hidden, default: en }
      - { name: slug, label: Slug, widget: string, hint: 'Lowercase words separated by hyphens. Becomes the URL and the filename.', pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase kebab-case (a-z, 0-9, single hyphens).'] }
      # Hidden + dynamic default: auto-derived from the slug field so it never
      # has to be filled while English-only. Sveltia resolves {{fields.slug}}
      # against the sibling slug field at save time. As defense-in-depth, the
      # Zod schema in src/content.config.ts also back-fills translationKey from
      # slug if this ever serializes empty, so the build can't break either way.
      - { name: translationKey, label: Translation key, widget: hidden, default: '{{fields.slug}}' }
      - { name: relatedPlatform, label: Related platform, widget: select, required: false, options: ['twitter', 'instagram', 'linkedin', 'facebook', 'sms', 'threads', 'general'] }
      - name: category
        label: Category
        widget: select
        hint: 'Assign this post to one blog category. Determines which category hub page it appears on.'
        options:
          - { label: 'Twitter / X', value: twitter-x }
          - { label: 'LinkedIn', value: linkedin }
          - { label: 'Instagram', value: instagram }
          - { label: 'Facebook', value: facebook }
          - { label: 'Threads', value: threads }
          - { label: 'SMS Marketing', value: sms-marketing }
          - { label: 'SEO & SERP', value: seo-serp }
          - { label: 'Copywriting & Strategy', value: copywriting-strategy }
          - { label: 'Tools & Automation', value: tools-automation }
      - { name: author, label: Author, widget: string, default: 'PostTruncate Team' }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: ogImage, label: Social image, widget: image, required: false, hint: 'Optional. Falls back to the site default (/og.png).' }
      # Rich-text body. `editor_components: [image, code-block]` give the media-
      # library image insert + code blocks. Videos: paste a YouTube/Vimeo URL on
      # its own line — the build turns it into a responsive, lazy iframe.
      - name: body
        label: Body
        widget: markdown
        hint: 'To embed a video, paste a YouTube or Vimeo URL on its own line.'
        buttons:
          [
            bold,
            italic,
            code,
            link,
            heading-two,
            heading-three,
            quote,
            bulleted-list,
            numbered-list,
          ]
        editor_components: [image, code-block]
        modes: [rich_text, raw]
